[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antigen-screening-skill"
version = "0.4.0"
description = "Offline-verifiable Codex skill for antigen screening and ECD construct planning"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["antigen_screening"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
